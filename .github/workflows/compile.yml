name: Build

on:
  workflow_call:
    inputs:
      ARTIFACT_EXPIRE:
        type: string
        required: false
        default: "30"
        description: "How long the artifacts are available. 30 days by default so you don't end up like me hitting the spending limit after 4 days (Got too many artifacts)."
      PDB_ARTIFACT_EXPIRE:
        type: string
        required: false
        default: "1"
        description: "How long the artifacts for .pdb files are available. 1 days by default."
      PROJECT_NAME:
        type: string
        required: true
        default: "template"
        description: "The Project to compile. This should be the same value as you set in the premake5.lua"
      PROJECT_PATH:
        type: string
        required: false
        default: ""
        description: "The Path to the project"
      PROJECT_CONFIGURATION:
        type: string
        required: false
        default: "ReleaseWithSymbols"
        description: "The premake configuration to use"
      USE_PREFIX:
        type: string
        required: false
        default: "true"
        description: "If enabled, it will use the gm[realm]_[Project]_[platform].[extension] format. Else, it will just use [Project].[extension] name."
      BUILD_64x:
        type: string
        required: false
        default: "false"
        description: "If enabled, the project is also compiled for the 64x."
      BUILD_32x:
        type: string
        required: false
        default: "true"
        description: "If enabled, the project is also compiled for the 32x."
      BUILD_WINDOWS:
        type: string
        required: false
        default: "true"
        description: "If enabled, the project is compiled for Windows."
      BUILD_LINUX:
        type: string
        required: false
        default: "true"
        description: "If enabled, the project is compiled for Linux."
      BUILD_CACHE:
        type: string
        required: false
        default: "false"
        description: "If enabled, it caches build files to improve build speed."
      NO_SAVE_CACHE:
        type: string
        required: false
        default: "false"
        description: "If enabled, it caches won't save the cache."
      REALM:
        type: string
        required: false
        default: "sv"
        description: "The realm this module is compiled for."
      LINUX_FILEEXTENTION:
        type: string
        required: false
        default: "dll"
        description: "The file extension for Linux compiles. Used in cases where you compile a .so file."
      WINDOWS_FILEEXTENTION:
        type: string
        required: false
        default: "dll"
        description: "The file extension for Windows compiles."
      UPLOAD:
        type: string
        required: false
        default: "artifact"
        description: "How the result should be uploaded. Can be artifact or pterodactyl. Only works for Linux/Windows always uses artifacts."
      UPLOAD_PDB:
        type: string
        required: false
        default: "false"
        description: "If enabled, the .pdb file will also be uploaded."
      # All variables below are secrets, so pass them along as secrets. I should probably do this for other vars as well.
      #PTERODACTYL_URL:
      #  type: string
      #  required: false
      #  description: "The URL to the Pterodactyl site"
      #PTERODACTYL_SERVER:
      #  type: string
      #  required: false
      #  description: "The Server ID to upload the file"
      #PTERODACTYL_KEY:
      #  type: string
      #  required: false
      #  description: "The API Key to use for Pterodactyl"
      PTERODACTYL_PATH:
        type: string
        required: false
        default: "garrysmod%2Flua%2Fbin%2f"
        description: "The Path to upload the file into. Repace / with %2F"
      PTERODACTYL_RESTART:
        type: string
        required: false
        default: "true"
        description: "If true, it will shutdown the server before uploading the file and afterwards start it back up."
      PTERODACTYL_RESTART_SLEEPTIME:
        type: string
        required: false
        default: "3"
        description: "How long it will sleep before uploading the new file, giving it time to properly shutdown."
      GARRYSMOD_COMMON:
        type: string
        required: false
        default: "danielga/garrysmod_common"
        description: "The garrysmod_common repository to use. Useful if you have a custom one you want to use."
      GARRYSMOD_COMMON_BRANCH:
        type: string
        required: false
        default: "master"
        description: "The garrysmod_common branch to use."
      GARRYSMOD_COMMON_64XBRANCH:
        type: string
        required: false
        default: "x86-64-support-sourcesdk"
        description: "The garrysmod_common branch to use for the 64x compiles."
      SOURCESDK_MINIMAL:
        type: string
        required: false
        default: "danielga/sourcesdk-minimal"
        description: "The sourcesdk-minimal repository to use. Useful if you have a custom one you want to use."
      SOURCESDK_MINIMAL_BRANCH:
        type: string
        required: false
        default: "master"
        description: "The sourcesdk-minimal branch to use."
      SOURCESDK_MINIMAL_64XBRANCH:
        type: string
        required: false
        default: "x86-64-branch"
        description: "The sourcesdk-minimal branch to use for the 64x compiles."
      SCANNING:
        type: string
        required: false
        default: "danielga/scanning"
        description: "The scanning repository to use."
      SCANNING_BRANCH:
        type: string
        required: false
        default: "master"
        description: "The scanning branch to use."
      DETOURING:
        type: string
        required: false
        default: "danielga/detouring"
        description: "The detouring repository to use."
      DETOURING_BRANCH:
        type: string
        required: false
        default: "master"
        description: "The detouring branch to use."
      ADDITIONAL_DATA:
        type: string
        required: false
        default: "0"
        description: "Allows you to pass in a additional line into the workflow_info.txt"
      ADDITIONAL_ARGS_32x:
        type: string
        required: false
        default: ""
        description: "Allows you to pass in a additional arguments to make"
      ADDITIONAL_ARGS_64x:
        type: string
        required: false
        default: ""
        description: "Allows you to pass in a additional arguments to make"
      ADDITIONAL_LINUX_32_SETUP:
        type: string
        required: false
        default: ""
        description: "Allows you to pass in some bash commands to execute before premake"
      ADDITIONAL_LINUX_64_SETUP:
        type: string
        required: false
        default: ""
        description: "Allows you to pass in some bash commands to execute before premake"
      ADDITIONAL_WINDOWS_32_SETUP:
        type: string
        required: false
        default: ""
        description: "Allows you to pass in some cmd commands to execute before premake"
      ADDITIONAL_WINDOWS_64_SETUP:
        type: string
        required: false
        default: ""
        description: "Allows you to pass in some cmd commands to execute before premake"
      BUILD_WINDOWS_DEDICATED:
        type: string
        required: false
        default: "false"
        description: "If enabled, passes --dedicated to premake5, which defines DEDICATED for a Windows dedicated server build."
    secrets:
      PTERODACTYL_KEY:
        required: false
      PTERODACTYL_SERVER:
        required: false
      PTERODACTYL_URL:
        required: false
env:
  PROJECT_NAME_LINUX32: ${{ format('{0}{1}{2}{3}{4}', inputs.USE_PREFIX == 'true' && 'gm' || '', inputs.USE_PREFIX == 'true' && inputs.REALM || '', inputs.USE_PREFIX == 'true' && '_' || '', inputs.PROJECT_NAME, inputs.USE_PREFIX == 'true' && '_linux' || '') }}
  PROJECT_NAME_LINUX64: ${{ format('{0}{1}{2}{3}{4}', inputs.USE_PREFIX == 'true' && 'gm' || '', inputs.USE_PREFIX == 'true' && inputs.REALM || '', inputs.USE_PREFIX == 'true' && '_' || '', inputs.PROJECT_NAME, inputs.USE_PREFIX == 'true' && '_linux64' || '') }}
  PROJECT_NAME_WIN32: ${{ format('{0}{1}{2}{3}{4}', inputs.USE_PREFIX == 'true' && 'gm' || '', inputs.USE_PREFIX == 'true' && inputs.REALM || '', inputs.USE_PREFIX == 'true' && '_' || '', inputs.PROJECT_NAME, inputs.USE_PREFIX == 'true' && '_win32' || '') }}
  PROJECT_NAME_WIN64: ${{ format('{0}{1}{2}{3}{4}', inputs.USE_PREFIX == 'true' && 'gm' || '', inputs.USE_PREFIX == 'true' && inputs.REALM || '', inputs.USE_PREFIX == 'true' && '_' || '', inputs.PROJECT_NAME, inputs.USE_PREFIX == 'true' && '_win64' || '') }}
  PROJECT_PATH: ${{ format('{0}{1}', inputs.PROJECT_PATH != '' && 'cd ' || '', inputs.PROJECT_PATH) }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: raphaelit7/gmod-builder:latest_32x
    if: (inputs.BUILD_32x == 'true') && (inputs.BUILD_LINUX == 'true')
    env:
      PTERODACTYL_SERVER: ${{ secrets.PTERODACTYL_SERVER }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout
        with:
          submodules: recursive

      - uses: actions/checkout@v4
        name: Checkout garrysmod_common
        with:
          repository: ${{inputs.GARRYSMOD_COMMON}}
          ref: ${{inputs.GARRYSMOD_COMMON_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common'
          
      - uses: actions/checkout@v4
        name: Checkout premake-export-compile-commands
        with:
          repository: "danielga/premake-export-compile-commands"
          ref: master
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/premake/premake-export-compile-commands'
          submodules: 'recursive'

      - uses: actions/checkout@v4
        name: Checkout sourcesdk-minimal
        with:
          repository: ${{inputs.SOURCESDK_MINIMAL}}
          ref: ${{inputs.SOURCESDK_MINIMAL_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/sourcesdk-minimal'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout scanning
        with:
          repository: ${{inputs.SCANNING}}
          ref: ${{inputs.SCANNING_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/scanning'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout detouring
        with:
          repository: ${{inputs.DETOURING}}
          ref: ${{inputs.DETOURING_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/detouring'
          submodules: 'recursive'

      - name: Restore ccache
        if: inputs.BUILD_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.cache/ccache
          key: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-${{inputs.PROJECT_CONFIGURATION}}-32x-ccache-${{ hashFiles(format('{0}**/*.cpp', inputs.PROJECT_PATH), format('{0}**/*.h', inputs.PROJECT_PATH), format('{0}**/*.hxx', inputs.PROJECT_PATH), format('{0}**/*.cxx', inputs.PROJECT_PATH), format('{0}**/*.c', inputs.PROJECT_PATH), format('{0}**/premake5.lua', inputs.PROJECT_PATH)) }}
          restore-keys: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-${{inputs.PROJECT_CONFIGURATION}}-32x-ccache

      - name: Generate Project
        run: |
          ${{env.PROJECT_PATH}}
          echo "${{github.run_id}}" >> workflow_info.txt
          echo "${{github.run_number}}" >> workflow_info.txt
          echo "${{github.ref_name}}" >> workflow_info.txt
          echo "${{inputs.ADDITIONAL_DATA}}" >> workflow_info.txt
          ${{inputs.ADDITIONAL_LINUX_32_SETUP}}
          premake5 --gmcommon=garrysmod_common ${{ inputs.BUILD_WINDOWS_DEDICATED == 'true' && '--dedicated' || '' }} gmake

      - name: Make
        run: |
          ${{env.PROJECT_PATH}}
          cd projects/linux/gmake
          export CC="ccache gcc"
          export CXX="ccache g++"
          CONFIG_LC=$(echo "${{inputs.PROJECT_CONFIGURATION}}_x86" | tr '[:upper:]' '[:lower:]')
          make config=$CONFIG_LC ${{inputs.ADDITIONAL_ARGS_32x}}

      - name: Save ccache
        if: inputs.NO_SAVE_CACHE != 'true'
        uses: actions/cache/save@v4
        with:
          path: /github/home/.cache/ccache
          key: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-${{inputs.PROJECT_CONFIGURATION}}-32x-ccache-${{ hashFiles(format('{0}**/*.cpp', inputs.PROJECT_PATH), format('{0}**/*.h', inputs.PROJECT_PATH), format('{0}**/*.hxx', inputs.PROJECT_PATH), format('{0}**/*.cxx', inputs.PROJECT_PATH), format('{0}**/*.c', inputs.PROJECT_PATH), format('{0}**/premake5.lua', inputs.PROJECT_PATH)) }}

      - name: Show ccache stats
        if: inputs.BUILD_CACHE == 'true'
        run: ccache -s

      - name: Upload ccache log file for debugging
        if: inputs.UPLOAD == 'artifact' && inputs.BUILD_CACHE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PROJECT_NAME_LINUX32}}-ccache-debug-log
          path: "/tmp/ccache.log"
          retention-days: 1

      - uses: actions/upload-artifact@v4
        name: Upload ${{env.PROJECT_NAME_LINUX32}}.${{inputs.LINUX_FILEEXTENTION}} (Artifact)
        if: inputs.UPLOAD == 'artifact'
        with:
          name: ${{env.PROJECT_NAME_LINUX32}}.${{inputs.LINUX_FILEEXTENTION}}
          path: ${{inputs.PROJECT_PATH}}projects/linux/gmake/x86/${{inputs.PROJECT_CONFIGURATION}}/${{env.PROJECT_NAME_LINUX32}}.${{inputs.LINUX_FILEEXTENTION}}
          retention-days: ${{inputs.ARTIFACT_EXPIRE}}

      - name: Upload ${{env.PROJECT_NAME_LINUX32}}.${{inputs.LINUX_FILEEXTENTION}} (Pterodactyl)
        if: inputs.UPLOAD == 'pterodactyl' && env.PTERODACTYL_SERVER != ''
        run: |
          ${{env.PROJECT_PATH}}
          cd projects/linux/gmake/x86/${{inputs.PROJECT_CONFIGURATION}}/

          if [ "${{inputs.PTERODACTYL_RESTART}}" = "true" ]; then
            curl "https://${{secrets.PTERODACTYL_URL}}/api/client/servers/${{secrets.PTERODACTYL_SERVER}}/power" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ${{secrets.PTERODACTYL_KEY}}' \
            -X POST \
            -d '{ "signal": "stop" }'

            sleep ${{ inputs.PTERODACTYL_RESTART_SLEEPTIME }}
          fi

          curl "https://${{secrets.PTERODACTYL_URL}}/api/client/servers/${{secrets.PTERODACTYL_SERVER}}/files/write?file=%2F${{inputs.PTERODACTYL_PATH}}${{env.PROJECT_NAME_LINUX32}}.${{inputs.LINUX_FILEEXTENTION}}" \
            -H 'Accept: application/json' \
            -H 'Authorization: Bearer ${{secrets.PTERODACTYL_KEY}}' \
            -X POST \
            --data-binary '@${{env.PROJECT_NAME_LINUX32}}.${{inputs.LINUX_FILEEXTENTION}}'

          if [ "${{inputs.PTERODACTYL_RESTART}}" = "true" ]; then
            curl "https://${{secrets.PTERODACTYL_URL}}/api/client/servers/${{secrets.PTERODACTYL_SERVER}}/power" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ${{secrets.PTERODACTYL_KEY}}' \
            -X POST \
            -d '{ "signal": "start" }'
          fi

      - uses: actions/upload-artifact@v4
        name: Upload ${{env.PROJECT_NAME_LINUX32}}.pdb (Artifact)
        if: inputs.UPLOAD == 'artifact' && inputs.UPLOAD_PDB == 'true'
        with:
          name: ${{env.PROJECT_NAME_LINUX32}}.pdb
          path: ${{inputs.PROJECT_PATH}}projects/linux/gmake/x86/ReleaseWithSymbols/${{env.PROJECT_NAME_LINUX32}}.pdb
          retention-days: ${{inputs.PDB_ARTIFACT_EXPIRE}}

  build-linux-64x:
    runs-on: ubuntu-latest
    container: raphaelit7/gmod-builder:latest_64x
    if: (inputs.BUILD_64x == 'true') && (inputs.BUILD_LINUX == 'true')
    env:
      PTERODACTYL_SERVER: ${{ secrets.PTERODACTYL_SERVER }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: actions/checkout@v4
        name: Checkout garrysmod_common
        with:
          repository: ${{inputs.GARRYSMOD_COMMON}}
          ref: ${{inputs.GARRYSMOD_COMMON_64XBRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common'
          
      - uses: actions/checkout@v4
        name: Checkout premake-export-compile-commands
        with:
          repository: "danielga/premake-export-compile-commands"
          ref: master
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/premake/premake-export-compile-commands'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout sourcesdk-minimal
        with:
          repository: ${{inputs.SOURCESDK_MINIMAL}}
          ref: ${{inputs.SOURCESDK_MINIMAL_64XBRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/sourcesdk-minimal'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout scanning
        with:
          repository: ${{inputs.SCANNING}}
          ref: ${{inputs.SCANNING_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/scanning'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout detouring
        with:
          repository: ${{inputs.DETOURING}}
          ref: ${{inputs.DETOURING_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/detouring'
          submodules: 'recursive'

      - name: Restore ccache
        if: inputs.BUILD_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.cache/ccache
          key: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-${{inputs.PROJECT_CONFIGURATION}}-64x-ccache-${{ hashFiles(format('{0}**/*.cpp', inputs.PROJECT_PATH), format('{0}**/*.h', inputs.PROJECT_PATH), format('{0}**/*.hxx', inputs.PROJECT_PATH), format('{0}**/*.cxx', inputs.PROJECT_PATH), format('{0}**/*.c', inputs.PROJECT_PATH), format('{0}**/premake5.lua', inputs.PROJECT_PATH)) }}
          restore-keys: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-${{inputs.PROJECT_CONFIGURATION}}-64x-ccache

      - name: Generate Project
        run: |
          ${{env.PROJECT_PATH}}
          echo "${{github.run_id}}" >> workflow_info.txt
          echo "${{github.run_number}}" >> workflow_info.txt
          echo "${{github.ref_name}}" >> workflow_info.txt
          echo "${{inputs.ADDITIONAL_DATA}}" >> workflow_info.txt
          ${{inputs.ADDITIONAL_LINUX_64_SETUP}}
          premake5 --gmcommon=garrysmod_common ${{ inputs.BUILD_WINDOWS_DEDICATED == 'true' && '--dedicated' || '' }} gmake

      - name: Make 64x
        run: |
          ${{env.PROJECT_PATH}}
          cd projects/linux/gmake
          export CC="ccache gcc"
          export CXX="ccache g++"
          CONFIG_LC=$(echo "${{inputs.PROJECT_CONFIGURATION}}_x86_64" | tr '[:upper:]' '[:lower:]')
          make config=$CONFIG_LC ${{inputs.ADDITIONAL_ARGS_64x}}

      - name: Save ccache
        if: inputs.NO_SAVE_CACHE != 'true'
        uses: actions/cache/save@v4
        with:
          path: /github/home/.cache/ccache
          key: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-${{inputs.PROJECT_CONFIGURATION}}-64x-ccache-${{ hashFiles(format('{0}**/*.cpp', inputs.PROJECT_PATH), format('{0}**/*.h', inputs.PROJECT_PATH), format('{0}**/*.hxx', inputs.PROJECT_PATH), format('{0}**/*.cxx', inputs.PROJECT_PATH), format('{0}**/*.c', inputs.PROJECT_PATH), format('{0}**/premake5.lua', inputs.PROJECT_PATH)) }}

      - name: Show ccache stats
        if: inputs.BUILD_CACHE == 'true'
        run: ccache -s

      - uses: actions/upload-artifact@v4
        name: Upload ${{env.PROJECT_NAME_LINUX64}}.${{inputs.LINUX_FILEEXTENTION}} (Artifact)
        if: inputs.UPLOAD == 'artifact'
        with:
          name: "${{env.PROJECT_NAME_LINUX64}}.${{inputs.LINUX_FILEEXTENTION}} (64x)"
          path: ${{inputs.PROJECT_PATH}}projects/linux/gmake/x86_64/${{inputs.PROJECT_CONFIGURATION}}/${{env.PROJECT_NAME_LINUX64}}.${{inputs.LINUX_FILEEXTENTION}}
          retention-days: ${{inputs.ARTIFACT_EXPIRE}}

      - name: Upload ${{env.PROJECT_NAME_LINUX64}}.${{inputs.LINUX_FILEEXTENTION}} (Pterodactyl)
        if: inputs.UPLOAD == 'pterodactyl' && env.PTERODACTYL_SERVER != ''
        run: |
          ${{env.PROJECT_PATH}}
          cd projects/linux/gmake/x86_64/${{inputs.PROJECT_CONFIGURATION}}/

          if [ "${{inputs.PTERODACTYL_RESTART}}" = "true" ]; then
            curl "https://${{secrets.PTERODACTYL_URL}}/api/client/servers/${{secrets.PTERODACTYL_SERVER}}/power" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ${{secrets.PTERODACTYL_KEY}}' \
            -X POST \
            -d '{ "signal": "stop" }'

            sleep ${{ inputs.PTERODACTYL_RESTART_SLEEPTIME }}
          fi

          curl "https://${{secrets.PTERODACTYL_URL}}/api/client/servers/${{secrets.PTERODACTYL_SERVER}}/files/write?file=%2F${{inputs.PTERODACTYL_PATH}}${{env.PROJECT_NAME_LINUX64}}.${{inputs.LINUX_FILEEXTENTION}}" \
            -H 'Accept: application/json' \
            -H 'Authorization: Bearer ${{secrets.PTERODACTYL_KEY}}' \
            -X POST \
            --data-binary '@${{env.PROJECT_NAME_LINUX64}}.${{inputs.LINUX_FILEEXTENTION}}'

          if [ "${{inputs.PTERODACTYL_RESTART}}" = "true" ]; then
            curl "https://${{secrets.PTERODACTYL_URL}}/api/client/servers/${{secrets.PTERODACTYL_SERVER}}/power" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ${{secrets.PTERODACTYL_KEY}}' \
            -X POST \
            -d '{ "signal": "start" }'
          fi

      - uses: actions/upload-artifact@v4
        name: Upload ${{env.PROJECT_NAME_LINUX64}}.pdb (Artifact)
        if: inputs.UPLOAD == 'artifact' && inputs.UPLOAD_PDB == 'true'
        with:
          name: "${{env.PROJECT_NAME_LINUX64}}.pdb (64x)"
          path: ${{inputs.PROJECT_PATH}}projects/linux/gmake/x86_64/${{inputs.PROJECT_CONFIGURATION}}/${{env.PROJECT_NAME_LINUX64}}.pdb
          retention-days: ${{inputs.PDB_ARTIFACT_EXPIRE}}

  build-windows:
    runs-on: windows-2022
    if: (inputs.BUILD_32x == 'true') && (inputs.BUILD_WINDOWS == 'true')
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: actions/checkout@v4
        name: Checkout garrysmod_common
        with:
          repository: ${{inputs.GARRYSMOD_COMMON}}
          ref: ${{inputs.GARRYSMOD_COMMON_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common'
        
      - uses: actions/checkout@v4
        name: Checkout premake-export-compile-commands
        with:
          repository: "danielga/premake-export-compile-commands"
          ref: master
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/premake/premake-export-compile-commands'
          submodules: 'recursive'
  
      - uses: actions/checkout@v4
        name: Checkout sourcesdk-minimal
        with:
          repository: ${{inputs.SOURCESDK_MINIMAL}}
          ref: ${{inputs.SOURCESDK_MINIMAL_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/sourcesdk-minimal'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout scanning
        with:
          repository: ${{inputs.SCANNING}}
          ref: ${{inputs.SCANNING_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/scanning'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout detouring
        with:
          repository: ${{inputs.DETOURING}}
          ref: ${{inputs.DETOURING_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/detouring'
          submodules: 'recursive'

      - name: Install Premake
        run: |
          ${{env.PROJECT_PATH}}
          curl -L https://github.com/premake/premake-core/releases/download/v5.0.0-beta7/premake-5.0.0-beta7-windows.zip -o premake.zip
          tar -xf premake.zip

      - name: Cache MSBuild output
        uses: actions/cache@v4
        with:
          path: ${{ inputs.PROJECT_PATH }}projects/
          key: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-32x-ccache-${{ hashFiles(format('{0}**/*.cpp', inputs.PROJECT_PATH), format('{0}**/*.h', inputs.PROJECT_PATH), format('{0}**/*.hxx', inputs.PROJECT_PATH), format('{0}**/*.cxx', inputs.PROJECT_PATH), format('{0}**/*.c', inputs.PROJECT_PATH), format('{0}**/premake5.lua', inputs.PROJECT_PATH)) }}
          restore-keys: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-32x

      - name: Generate Project
        run: |
          ${{env.PROJECT_PATH}}
          echo "${{github.run_id}}" >> workflow_info.txt
          echo "${{github.run_number}}" >> workflow_info.txt
          echo "${{github.ref_name}}" >> workflow_info.txt
          echo "${{inputs.ADDITIONAL_DATA}}" >> workflow_info.txt
          ${{inputs.ADDITIONAL_WINDOWS_32_SETUP}}
          ./premake5.exe --gmcommon=garrysmod_common ${{ inputs.BUILD_WINDOWS_DEDICATED == 'true' && '--dedicated' || '' }} vs2022

      - name: Setup MSBuild environment
        uses: microsoft/setup-msbuild@v1

      - name: Build
        run: |
          ${{env.PROJECT_PATH}}
          cd projects/windows/vs2022
          msbuild /p:Configuration=${{inputs.PROJECT_CONFIGURATION}} /p:Platform=Win32 ${{inputs.PROJECT_NAME}}.sln

      - uses: actions/upload-artifact@v4
        if: inputs.UPLOAD == 'artifact'
        name: Upload ${{env.PROJECT_NAME_WIN32}}.${{inputs.WINDOWS_FILEEXTENTION}} (Artifact)
        with:
          name: "${{env.PROJECT_NAME_WIN32}}.${{inputs.WINDOWS_FILEEXTENTION}}${{ inputs.BUILD_WINDOWS_DEDICATED == 'true' && ' (Dedicated)' || '' }}"
          path: ${{inputs.PROJECT_PATH}}projects/windows/vs2022/x86/${{inputs.PROJECT_CONFIGURATION}}/${{env.PROJECT_NAME_WIN32}}.${{inputs.WINDOWS_FILEEXTENTION}}
          retention-days: ${{inputs.ARTIFACT_EXPIRE}}

      - uses: actions/upload-artifact@v4
        if: inputs.UPLOAD_PDB == 'true'
        name: Upload ${{env.PROJECT_NAME_WIN32}}.pdb (Artifact)
        with:
          name: "${{env.PROJECT_NAME_WIN32}}.pdb${{ inputs.BUILD_WINDOWS_DEDICATED == 'true' && ' (Dedicated)' || '' }}"
          path: ${{inputs.PROJECT_PATH}}projects/windows/vs2022/x86/${{inputs.PROJECT_CONFIGURATION}}/${{env.PROJECT_NAME_WIN32}}.pdb
          retention-days: ${{inputs.PDB_ARTIFACT_EXPIRE}}

  build-windows-64x:
    runs-on: windows-2022
    if: (inputs.BUILD_64x == 'true') && (inputs.BUILD_WINDOWS == 'true')
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: actions/checkout@v4
        name: Checkout garrysmod_common
        with:
          repository: ${{inputs.GARRYSMOD_COMMON}}
          ref: ${{inputs.GARRYSMOD_COMMON_64XBRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common'
          
      - uses: actions/checkout@v4
        name: Checkout premake-export-compile-commands
        with:
          repository: "danielga/premake-export-compile-commands"
          ref: master
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/premake/premake-export-compile-commands'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout sourcesdk-minimal
        with:
          repository: ${{inputs.SOURCESDK_MINIMAL}}
          ref: ${{inputs.SOURCESDK_MINIMAL_64XBRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/sourcesdk-minimal'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout scanning
        with:
          repository: ${{inputs.SCANNING}}
          ref: ${{inputs.SCANNING_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/scanning'
          submodules: 'recursive'
          
      - uses: actions/checkout@v4
        name: Checkout detouring
        with:
          repository: ${{inputs.DETOURING}}
          ref: ${{inputs.DETOURING_BRANCH}}
          path: '${{inputs.PROJECT_PATH}}garrysmod_common/detouring'
          submodules: 'recursive'

      - name: Install Premake
        run: |
          ${{env.PROJECT_PATH}}
          curl -L https://github.com/premake/premake-core/releases/download/v5.0.0-beta7/premake-5.0.0-beta7-windows.zip -o premake.zip
          tar -xf premake.zip

      - name: Cache MSBuild output
        uses: actions/cache@v4
        with:
          path: ${{ inputs.PROJECT_PATH }}projects/
          key: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-64x-ccache-${{ hashFiles(format('{0}**/*.cpp', inputs.PROJECT_PATH), format('{0}**/*.h', inputs.PROJECT_PATH), format('{0}**/*.hxx', inputs.PROJECT_PATH), format('{0}**/*.cxx', inputs.PROJECT_PATH), format('{0}**/*.c', inputs.PROJECT_PATH), format('{0}**/premake5.lua', inputs.PROJECT_PATH)) }}
          restore-keys: ${{ runner.os }}-${{ inputs.PROJECT_NAME }}-64x

      - name: Generate Project
        run: |
          ${{env.PROJECT_PATH}}
          echo "${{github.run_id}}" >> workflow_info.txt
          echo "${{github.run_number}}" >> workflow_info.txt
          echo "${{github.ref_name}}" >> workflow_info.txt
          echo "${{inputs.ADDITIONAL_DATA}}" >> workflow_info.txt
          ${{inputs.ADDITIONAL_WINDOWS_64_SETUP}}
          ./premake5.exe --gmcommon=garrysmod_common ${{ inputs.BUILD_WINDOWS_DEDICATED == 'true' && '--dedicated' || '' }} vs2022

      - name: Setup MSBuild environment
        uses: microsoft/setup-msbuild@v1

      - name: Build
        run: |
          ${{env.PROJECT_PATH}}
          cd projects/windows/vs2022
          msbuild /p:Configuration=${{inputs.PROJECT_CONFIGURATION}} /p:Platform=x64 ${{inputs.PROJECT_NAME}}.sln

      - uses: actions/upload-artifact@v4
        if: inputs.UPLOAD == 'artifact'
        name: Upload ${{env.PROJECT_NAME_WIN64}}.${{inputs.WINDOWS_FILEEXTENTION}} (Artifact)
        with:
          name: "${{env.PROJECT_NAME_WIN64}}.${{inputs.WINDOWS_FILEEXTENTION}} (64x)${{ inputs.BUILD_WINDOWS_DEDICATED == 'true' && ' (Dedicated)' || '' }}"
          path: ${{inputs.PROJECT_PATH}}projects/windows/vs2022/x86_64/${{inputs.PROJECT_CONFIGURATION}}/${{env.PROJECT_NAME_WIN64}}.${{inputs.WINDOWS_FILEEXTENTION}}
          retention-days: ${{inputs.ARTIFACT_EXPIRE}}

      - uses: actions/upload-artifact@v4
        if: inputs.UPLOAD_PDB == 'true'
        name: Upload ${{env.PROJECT_NAME_WIN64}}.pdb (Artifact)
        with:
          name: "${{env.PROJECT_NAME_WIN64}}.pdb (64x)${{ inputs.BUILD_WINDOWS_DEDICATED == 'true' && ' (Dedicated)' || '' }}"
          path: ${{inputs.PROJECT_PATH}}projects/windows/vs2022/x86_64/${{inputs.PROJECT_CONFIGURATION}}/${{env.PROJECT_NAME_WIN64}}.pdb
          retention-days: ${{inputs.PDB_ARTIFACT_EXPIRE}}
